name: Playwright Tests
on:
  # Every PR, including stacked PRs that target another PR's branch.
  pull_request:

permissions:
  contents: read

jobs:
  test_e2e:
    name: Playwright tests
    timeout-minutes: 60
    # Playwright 1.56 has no browser builds for Ubuntu 26.04, which
    # ubuntu-latest now is. Move back once Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare testing env
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn
      - name: Build the reference site
        run: yarn build:site
      - name: Install Playwright Browsers
        # apt can stall on the runner's Ubuntu mirror; fail fast instead of
        # using up the job timeout.
        timeout-minutes: 10
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: yarn workspace @jpmorganchase/mosaic-site e2e
        env:
          PLAYWRIGHT_START_SITE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./packages/site/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
