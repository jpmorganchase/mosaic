name: Release

# npm trusts this workflow file to publish every package, so stable releases
# and pull request snapshot releases both live here.
#
# Snapshot releases run on `workflow_dispatch`: npm refuses trusted-publishing
# token exchanges for `issue_comment` runs. A `/snapshot-release` comment is
# turned into a dispatch by snapshot-release.yml, and people with write access
# can also start one from the Actions tab. Pull request code only runs in the
# credential-free snapshot-build job; the publish job checks every tarball
# before publishing it (see scripts/snapshot/).

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number to publish a snapshot release of'
        required: true
        type: string
      sha:
        description: 'Expected head commit (the run stops if the pull request has moved on)'
        required: false
        type: string
      comment_id:
        description: 'Comment that requested the release (set by snapshot-release.yml)'
        required: false
        type: string
      dry_run:
        description: 'Check everything, including npm trusted publishing, without publishing'
        required: false
        type: boolean
        default: false

permissions: {}

# Snapshot runs get a group per pull request, so they can't hold up or cancel
# a stable release, and a second request can't cancel one mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('snapshot-{0}', inputs.pull_request) || github.ref }}
  cancel-in-progress: false

jobs:
  select-release-mode:
    name: Select Release Mode
    if: github.event_name == 'push' && github.repository == 'jpmorganchase/mosaic'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    permissions:
      contents: read # Needed to check out the repository before selecting Changesets mode.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Dependencies
        run: yarn install
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Packages
    if: needs.select-release-mode.outputs.mode == 'version'
    needs: select-release-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for changesets to commit version changes.
      pull-requests: write # Needed for changesets to open/update the Version Packages PR.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Dependencies
        run: yarn install
      - name: Version packages
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: yarn changeset version
          # A non-default token is used so the Version Packages PR triggers CI workflows.
          github-token: ${{ secrets.MOSAIC_GITHUB_TOKEN }}

  publish:
    name: Publish Packages
    if: needs.select-release-mode.outputs.mode == 'publish'
    needs: select-release-mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Needed for changesets to push tags and create GitHub releases.
      id-token: write # Needed for npm trusted publishing (provenance is generated automatically).
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Install Dependencies
        run: yarn install
      - name: Build
        run: yarn build
      - name: Publish packages
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: node ./scripts/publishWithRetry.mjs
          github-token: ${{ secrets.MOSAIC_GITHUB_TOKEN }}

  release:
    name: Release
    if: always() && github.event_name == 'push' && github.repository == 'jpmorganchase/mosaic'
    needs:
      - select-release-mode
      - version
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check release result
        uses: actions/github-script@v8
        env:
          MODE: ${{ needs.select-release-mode.outputs.mode }}
          SELECT_RESULT: ${{ needs.select-release-mode.result }}
          VERSION_RESULT: ${{ needs.version.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const mode = process.env.MODE || '';
            const selectResult = process.env.SELECT_RESULT;
            const versionResult = process.env.VERSION_RESULT;
            const publishResult = process.env.PUBLISH_RESULT;

            core.info(`Selected mode: ${mode || '<empty>'}`);
            core.info(`select-release-mode: ${selectResult}`);
            core.info(`version: ${versionResult}`);
            core.info(`publish: ${publishResult}`);

            if (selectResult !== 'success') {
              core.setFailed('Release mode selection failed.');
              return;
            }

            if (mode === 'version' && versionResult !== 'success') {
              core.setFailed('Version package PR creation failed.');
              return;
            }

            if (mode === 'publish' && publishResult !== 'success') {
              core.setFailed('Package publish failed.');
              return;
            }

            if (!['none', 'publish', 'version'].includes(mode)) {
              core.setFailed(`Unexpected Changesets mode: ${mode || '<empty>'}`);
            }

  # Snapshot releases. Started by snapshot-release.yml (a `/snapshot-release`
  # comment) or by hand from the Actions tab; GitHub only lets people with
  # write access start a workflow_dispatch run.

  snapshot-check:
    name: Check Snapshot Request
    if: github.event_name == 'workflow_dispatch' && github.repository == 'jpmorganchase/mosaic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out this workflow's own commit for the request script.
      pull-requests: read # Read the pull request's state and head commit.
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the pull request
        id: check
        uses: actions/github-script@v8
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          EXPECTED_SHA: ${{ inputs.sha }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { checkSnapshotDispatch } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/snapshot/request.mjs`).href
            );
            const result = await checkSnapshotDispatch({
              github,
              context,
              pullRequest: process.env.PULL_REQUEST,
              expectedSha: process.env.EXPECTED_SHA
            });
            if (!result.ok) {
              core.setFailed(result.reason);
              return;
            }
            core.setOutput('sha', result.sha);

  snapshot-build:
    name: Build Snapshot Packages
    needs: snapshot-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs pull request code, so it gets read access and nothing else: no
    # id-token, no npm credentials and no write token.
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.snapshot-check.outputs.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Dependencies
        run: yarn install
      - name: Create snapshot versions
        # The added changeset guarantees a version bump; the fixed
        # @jpmorganchase/* group takes every package to the snapshot version.
        run: |
          rm -f .changeset/pre.json
          printf -- "---\n'@jpmorganchase/mosaic-types': patch\n---\n\nSnapshot release\n" > .changeset/snapshot-release.md
          yarn changeset version --snapshot snapshot
      - name: Build
        run: yarn build
      - name: Pack packages
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot-tarballs"
          yarn workspaces foreach --all --no-private pack --out "$RUNNER_TEMP/snapshot-tarballs/%s-%v.tgz"
      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-tarballs
          path: ${{ runner.temp }}/snapshot-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  snapshot-publish:
    name: Publish Snapshot Packages
    needs: snapshot-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the publish credential, so it never runs pull request code: it
    # checks out this workflow's own commit and only reads the tarballs.
    permissions:
      contents: read # Check out this workflow's own commit for the publish scripts.
      id-token: write # npm trusted publishing.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          name: snapshot-tarballs
          path: ${{ runner.temp }}/snapshot-tarballs
      - name: Check and publish tarballs
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/snapshot/publishTarballs.mjs "$RUNNER_TEMP/snapshot-tarballs" --dry-run
          else
            node scripts/snapshot/publishTarballs.mjs "$RUNNER_TEMP/snapshot-tarballs"
          fi

  snapshot-report:
    name: Report Snapshot Release
    needs:
      - snapshot-check
      - snapshot-build
      - snapshot-publish
    if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'jpmorganchase/mosaic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out this workflow's own commit for the report script.
      issues: write # Comment on the pull request.
      pull-requests: write # React to the request comment.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Report on the pull request
        uses: actions/github-script@v8
        env:
          PULL_REQUEST: ${{ inputs.pull_request }}
          COMMENT_ID: ${{ inputs.comment_id }}
          SHA: ${{ needs.snapshot-check.outputs.sha }}
          RESULT: ${{ needs.snapshot-publish.result }}
          PUBLISHED: ${{ needs.snapshot-publish.outputs.published }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { reportSnapshotRelease } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/snapshot/request.mjs`).href
            );
            await reportSnapshotRelease({
              github,
              context,
              core,
              pullRequest: process.env.PULL_REQUEST,
              commentId: process.env.COMMENT_ID,
              sha: process.env.SHA,
              result: process.env.RESULT,
              published: process.env.PUBLISHED,
              dryRun: process.env.DRY_RUN === 'true'
            });
